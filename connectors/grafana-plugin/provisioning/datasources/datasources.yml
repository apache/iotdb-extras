apiVersion: 1

# Development datasource pointing at the IoTDB service started by the sibling
# docker-compose.yaml. `url` is the REST endpoint the tree-model query modes
# use; `rpcAddress` is the native Thrift endpoint the table-model mode talks to.
# The credentials are IoTDB's defaults and are meant for local development only.
datasources:
  - name: IoTDB
    type: apache-iotdb-datasource
    access: proxy
    isDefault: true
    orgId: 1
    version: 1
    editable: true
    jsonData:
      url: http://iotdb:18080
      username: root
      rpcAddress: iotdb:6667
    secureJsonData:
      password: root
