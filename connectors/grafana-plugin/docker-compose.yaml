services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      - iotdb

  # A standalone IoTDB for local development, wired to the provisioned
  # datasource in ./provisioning. The REST port serves the tree-model query
  # modes; 6667 is the native Thrift port the table-model mode uses.
  iotdb:
    image: apache/iotdb:2.0.8-standalone
    container_name: iotdb
    environment:
      - dn_rpc_address=0.0.0.0
      - enable_rest_service=true
    ports:
      - 6667:6667/tcp
      - 18080:18080/tcp
